[package]
name = "nova-desktop"
version = "0.1.0"
description = "NOVA AI Companion Desktop"
authors = ["NOVA Team"]
license = "MIT"
repository = ""
default-run = "nova-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib_name` value must equal the `lib` entry in `tauri.conf.json`.
# It is required for desktop builds and mobile builds.
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
