<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOVA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0d14;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(12px);background:rgba(10,13,20,0.9)}
.header .dot{width:8px;height:8px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;animation:pulse 2s infinite}
.header h1{font-size:14px;font-weight:600;letter-spacing:3px;color:#7dd3fc;font-family:'Courier New',monospace}
.header .status{margin-left:auto;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1.5px}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeIn 0.2s}
.msg.user{align-self:flex-end;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.2);border-bottom-right-radius:4px}
.msg.nova{align-self:flex-start;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-bottom-left-radius:4px}
.msg.nova .label{font-size:9px;letter-spacing:2px;color:#38bdf8;margin-bottom:4px;font-family:monospace}
.msg.thinking{opacity:0.6;font-style:italic}
.composer{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;background:rgba(10,13,20,0.95);backdrop-filter:blur(12px)}
.composer input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 14px;color:#e2e8f0;font-size:15px;outline:none}
.composer input:focus{border-color:rgba(56,189,248,0.3)}
.composer input::placeholder{color:rgba(255,255,255,0.2)}
.composer button{background:rgba(56,189,248,0.2);border:1px solid rgba(56,189,248,0.3);border-radius:12px;color:#7dd3fc;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;min-width:52px}
.composer button:active{background:rgba(56,189,248,0.3)}
.composer button:disabled{opacity:0.3}
@keyframes pulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}
</style>
</head>
<body>
<div class="header">
  <div class="dot"></div>
  <h1>N O V A</h1>
  <span class="status">CONNECTED</span>
</div>
<div class="messages" id="messages"></div>
<div class="composer safe-bottom">
  <input id="input" type="text" placeholder="Ask Nova..." autocomplete="off" autocapitalize="sentences">
  <button id="send" onclick="send()">▸</button>
</div>
<script>
const API = location.origin;
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const btn = document.getElementById('send');
let busy = false;

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (role === 'nova') d.innerHTML = '<div class="label">NOVA</div>' + text;
  else d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  addMsg('user', text);
  busy = true;
  btn.disabled = true;
  const thinking = addMsg('nova', 'Thinking...');
  thinking.classList.add('thinking');
  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await r.json();
    thinking.remove();
    addMsg('nova', data.response || 'No response.');
  } catch(e) {
    thinking.remove();
    addMsg('nova', 'Connection error: ' + e.message);
  }
  busy = false;
  btn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
addMsg('nova', 'Online and ready, sir. How may I assist?');
</script>
</body>
</html>
